
</html>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Essential for mobile device scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Game</title>
    <style>
        /* CSS Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container designed to scale on mobile and desktop */
        .container {
            background-color: white;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #cf3c13;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        #game-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Logic-based classes for the UI */
        .win { background-color: #e6fffa; color: #234e52; border: 1px solid #81e6d9; }
        .lose { background-color: #fff5f5; color: #c53030; border: 1px solid #feb2b2; }

        .points-text {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.3rem;
        }

        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Secret Number Game</h1>
        <div id="game-output">
            <p>I have picked a secret number.</p>
            <br>
            <button onclick="runGame()">Start Guessing</button>
        </div>
    </div>


    <script>
    function runGame() {
    // 1. Setup: Choose a secret number between 1 and 5
    const secretNumber = Math.floor(Math.random() * 5) + 1;
    let guess;
    let attempts = 0;
    const outputDiv = document.getElementById('game-output');

    // 2. The Game Loop: Keep asking until they get it right
    while (true) {
        guess = prompt("Pick a number between 1 and 5:");

        // Exit if user clicks 'Cancel'
        if (guess === null) break;

        // Validation: Must be a number AND between 1 and 5
        let numGuess = Number(guess);
        if (isNaN(numGuess) || guess.trim() === "" || numGuess < 1 || numGuess > 5) {
            alert("Invalid choice! Please pick a whole number between!!!! 1 and 5.");
            continue; // Skip the rest of the loop and ask again
        }

        attempts++;

        // 3. Win/Loss Logic
        if (numGuess === secretNumber) {
            outputDiv.innerHTML = `
                <div id="game-status" class="win">
                    <strong>🎉 Congratulations!</strong><br>
                    You guessed ${secretNumber} correctly in ${attempts} tries!
                    <span class="points-text">Points Earned: ${10}</span>
                </div>
                <br><button onclick="location.reload()">Play Again</button>
            `;
            break; // Stop the loop because they won
        } else {
            alert(`😔 ${numGuess} is wrong. Try again!`);
        }
    }
}

</script>
</body>
</html>
